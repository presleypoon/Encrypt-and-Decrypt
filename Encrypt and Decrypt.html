<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Binary Encoder/Decoder</title>
	<link rel="stylesheet" href="Encrypt and Decrypt.css">
</head>

<body>

	<h2>Binary Converter (Custom Cipher)</h2>
	<p>Type your message below. You can use multiple lines!</p>

	<textarea id="userInput" placeholder="Type text to encrypt OR paste binary to decrypt..."></textarea>

	<div class="button-group">
		<button id="toBin">Encrypt to Binary</button>
		<button id="toChar">Decrypt to Text</button>
		<button id="copyBtn">Copy Result</button>
	</div>

	<span id="outputLabel">Result:</span>
	<div id="output">Your result will appear here...</div>
	<div id="status" class="status-msg">System Ready</div>

	<script src="Encrypt and Decrypt.js"></script>
</body>

</html>
